<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AetherDrop — Thả File HTML Tạo Link Đẹp Nhất Trái Đất</title>
  <style>
    :root {
      --bg-dark: #050811;
      --surface: rgba(15, 23, 42, 0.72);
      --surface-2: rgba(9, 13, 24, 0.85);
      --border: rgba(255, 255, 255, 0.11);
      --border-glow: rgba(56, 189, 248, 0.55);
      --text: #f8fafc;
      --muted: #94a3b8;
      --cyan: #38bdf8;
      --violet: #a855f7;
      --pink: #ec4899;
      --emerald: #10b981;
      --danger: #fb7185;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Plus Jakarta Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
    }

    body {
      min-height: 100vh;
      color: var(--text);
      background: var(--bg-dark);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 28px 16px;
      position: relative;
      overflow-x: hidden;
    }

    /* Aurora background orbs */
    .aurora {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(95px);
      opacity: 0.42;
      animation: floatOrb 14s ease-in-out infinite alternate;
    }

    .orb-1 {
      width: 420px;
      height: 420px;
      background: radial-gradient(circle, var(--cyan), transparent 70%);
      top: -110px;
      left: -80px;
    }

    .orb-2 {
      width: 460px;
      height: 460px;
      background: radial-gradient(circle, var(--violet), transparent 70%);
      bottom: -140px;
      right: -90px;
      animation-delay: -5s;
    }

    .orb-3 {
      width: 300px;
      height: 300px;
      background: radial-gradient(circle, var(--pink), transparent 70%);
      top: 45%;
      left: 55%;
      opacity: 0.22;
      animation-delay: -9s;
    }

    @keyframes floatOrb {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(35px, -25px) scale(1.12); }
    }

    .container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 640px;
      background: var(--surface);
      backdrop-filter: blur(22px) saturate(150%);
      -webkit-backdrop-filter: blur(22px) saturate(150%);
      border: 1px solid var(--border);
      border-radius: 26px;
      padding: 32px 26px;
      box-shadow:
        0 30px 80px rgba(0, 0, 0, 0.6),
        inset 0 1px 0 rgba(255, 255, 255, 0.14);
      display: grid;
      gap: 22px;
    }

    .top-bar {
      display: flex;
      justify-content: center;
    }

    .pill-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 0.74rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #e0f2fe;
      background: linear-gradient(90deg, rgba(56, 189, 248, 0.18), rgba(168, 85, 247, 0.18));
      border: 1px solid rgba(255, 255, 255, 0.16);
    }

    .dot-live {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--emerald);
      box-shadow: 0 0 10px var(--emerald);
    }

    .hero {
      text-align: center;
      display: grid;
      gap: 10px;
    }

    h1 {
      font-size: clamp(1.6rem, 4vw, 2.15rem);
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1.15;
      background: linear-gradient(110deg, #ffffff 15%, #7dd3fc 50%, #d8b4fe 85%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .hero p {
      color: var(--muted);
      font-size: 0.94rem;
      line-height: 1.55;
      max-width: 460px;
      margin: 0 auto;
    }

    .dropzone {
      position: relative;
      border-radius: 20px;
      padding: 42px 22px;
      text-align: center;
      background:
        linear-gradient(var(--surface-2), var(--surface-2)) padding-box,
        repeating-linear-gradient(
          90deg,
          rgba(148, 163, 184, 0.35) 0 10px,
          transparent 10px 18px
        ) border-box;
      border: 1.5px dashed transparent;
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.22, 1, 0.36, 1);
      display: grid;
      gap: 10px;
      justify-items: center;
    }

    .dropzone:hover,
    .dropzone.active {
      transform: translateY(-2px);
      background:
        linear-gradient(rgba(14, 24, 46, 0.92), rgba(14, 24, 46, 0.92)) padding-box,
        linear-gradient(120deg, var(--cyan), var(--violet), var(--pink)) border-box;
      box-shadow: 0 18px 40px rgba(56, 189, 248, 0.16);
    }

    .icon-ring {
      width: 64px;
      height: 64px;
      border-radius: 20px;
      display: grid;
      place-items: center;
      font-size: 1.8rem;
      font-weight: 300;
      color: #fff;
      background: linear-gradient(135deg, rgba(56, 189, 248, 0.25), rgba(168, 85, 247, 0.25));
      border: 1px solid rgba(255, 255, 255, 0.18);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.25);
      transition: transform 0.25s ease;
    }

    .dropzone:hover .icon-ring,
    .dropzone.active .icon-ring {
      transform: scale(1.06) rotate(4deg);
    }

    .drop-main {
      font-size: 1.05rem;
      font-weight: 700;
      color: #f8fafc;
    }

    .drop-sub {
      font-size: 0.85rem;
      color: var(--muted);
    }

    .result-card {
      display: none;
      background: var(--surface-2);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 20px;
      padding: 20px;
      gap: 16px;
      animation: popUp 0.28s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .result-card.show {
      display: grid;
    }

    @keyframes popUp {
      from { opacity: 0; transform: translateY(10px) scale(0.99); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .meta-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }

    .file-chip {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      max-width: 100%;
      padding: 6px 13px;
      border-radius: 999px;
      font-size: 0.82rem;
      font-weight: 700;
      color: #a7f3d0;
      background: rgba(16, 185, 129, 0.14);
      border: 1px solid rgba(16, 185, 129, 0.3);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .size-tag {
      font-size: 0.78rem;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }

    .url-group {
      display: flex;
      gap: 8px;
    }

    .url-field {
      flex: 1;
      min-width: 0;
      background: #050811;
      border: 1px solid rgba(148, 163, 184, 0.22);
      border-radius: 12px;
      padding: 12px 14px;
      color: #7dd3fc;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.8rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .url-field:focus {
      border-color: var(--cyan);
    }

    .btn {
      border: none;
      border-radius: 12px;
      padding: 12px 16px;
      font-size: 0.88rem;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      transition: all 0.18s ease;
    }

    .btn:hover {
      transform: translateY(-1px);
      filter: brightness(1.07);
    }

    .btn:active {
      transform: translateY(0);
    }

    .btn-copy {
      background: rgba(255, 255, 255, 0.08);
      color: #f8fafc;
      border: 1px solid rgba(255, 255, 255, 0.16);
      padding: 10px 15px;
      font-size: 0.84rem;
      white-space: nowrap;
    }

    .btn-copy.copied {
      background: rgba(16, 185, 129, 0.2);
      border-color: rgba(16, 185, 129, 0.5);
      color: #6ee7b7;
    }

    .cta-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
    }

    .btn-launch {
      background: linear-gradient(135deg, #38bdf8 0%, #818cf8 55%, #c084fc 100%);
      color: #060913;
      font-weight: 800;
      box-shadow: 0 12px 28px rgba(99, 102, 241, 0.32);
    }

    .btn-ghost {
      background: transparent;
      color: var(--muted);
      border: 1px solid rgba(148, 163, 184, 0.22);
      padding: 10px 15px;
      font-size: 0.84rem;
    }

    .btn-ghost:hover {
      color: #fff;
      border-color: rgba(255, 255, 255, 0.4);
    }

    .preview-box {
      border-radius: 14px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: #0b0f19;
    }

    .preview-head {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 12px;
      background: rgba(255, 255, 255, 0.03);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      font-size: 0.74rem;
      color: var(--muted);
    }

    .mac-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }
    .mac-r { background: #fb7185; }
    .mac-y { background: #fbbf24; }
    .mac-g { background: #34d399; }

    .preview-frame {
      width: 100%;
      height: 190px;
      border: none;
      background: #ffffff;
      display: block;
    }

    .toast {
      text-align: center;
      font-size: 0.84rem;
      font-weight: 600;
      color: #7dd3fc;
      min-height: 20px;
    }

    .toast.err {
      color: var(--danger);
    }

    @media (max-width: 520px) {
      .container { padding: 24px 16px; border-radius: 20px; }
      .cta-row { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="aurora" aria-hidden="true">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
  </div>

  <main class="container">
    <div class="top-bar">
      <span class="pill-badge"><span class="dot-live"></span>Instant HTML Link Studio</span>
    </div>

    <header class="hero">
      <h1>Thả File HTML Tạo Link</h1>
      <p>Kéo thả file <strong>.html</strong> vào khung để tạo đường link mở nhanh và xem trước trực tiếp</p>
    </header>

    <div id="dropZone" class="dropzone" tabindex="0" role="button" aria-label="Kéo thả hoặc chọn file HTML">
      <div class="icon-ring">+</div>
      <div class="drop-main">Kéo & thả file .html vào đây</div>
      <div class="drop-sub">Hoặc bấm để chọn file từ thiết bị của bạn</div>
      <input id="fileInput" type="file" accept=".html,.htm,text/html" hidden />
    </div>

    <section id="resultCard" class="result-card" aria-live="polite">
      <div class="meta-row">
        <span id="fileChip" class="file-chip">page.html</span>
        <span id="sizeTag" class="size-tag">0 KB</span>
      </div>

      <div class="url-group">
        <input id="urlOutput" class="url-field" type="text" readonly />
        <button id="btnCopy" class="btn btn-copy" type="button">Copy link</button>
      </div>

      <div class="cta-row">
        <a id="btnLaunch" class="btn btn-launch" href="#" target="_blank" rel="noopener">Mở link ngay</a>
        <button id="btnClear" class="btn btn-ghost" type="button">Thả file khác</button>
      </div>

      <div class="preview-box">
        <div class="preview-head">
          <span class="mac-dot mac-r"></span>
          <span class="mac-dot mac-y"></span>
          <span class="mac-dot mac-g"></span>
          <span style="margin-left: 6px;">Xem trước nhanh</span>
        </div>
        <iframe id="previewFrame" class="preview-frame" title="Xem trước trang HTML"></iframe>
      </div>
    </section>

    <div id="toast" class="toast"></div>
  </main>

  <script>
    (function renderSharedSite() {
      const hash = window.location.hash;
      if (hash && hash.startsWith("#site=")) {
        try {
          const encoded = hash.slice(6);
          const binary = atob(encoded);
          const bytes = new Uint8Array(binary.length);
          for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
          const html = new TextDecoder("utf-8").decode(bytes);
          document.open();
          document.write(html);
          document.close();
        } catch (err) {
          console.error(err);
        }
      }
    })();

    const dropZone = document.getElementById("dropZone");
    const fileInput = document.getElementById("fileInput");
    const resultCard = document.getElementById("resultCard");
    const fileChip = document.getElementById("fileChip");
    const sizeTag = document.getElementById("sizeTag");
    const urlOutput = document.getElementById("urlOutput");
    const btnCopy = document.getElementById("btnCopy");
    const btnLaunch = document.getElementById("btnLaunch");
    const btnClear = document.getElementById("btnClear");
    const previewFrame = document.getElementById("previewFrame");
    const toast = document.getElementById("toast");

    let currentHtml = "";

    function showToast(msg, isError = false) {
      toast.textContent = msg;
      toast.className = isError ? "toast err" : "toast";
    }

    function encodeUtf8Base64(str) {
      const bytes = new TextEncoder().encode(str);
      let binary = "";
      for (let i = 0; i < bytes.length; i++) {
        binary += String.fromCharCode(bytes[i]);
      }
      return btoa(binary);
    }

    function formatSize(bytes) {
      if (bytes < 1024) return `${bytes} B`;
      if (bytes < 1024 * 1024) return `${(bytes / 1024).toFixed(1)} KB`;
      return `${(bytes / (1024 * 1024)).toFixed(2)} MB`;
    }

    function handleIncomingFile(file) {
      if (!file) return;
      if (!/\.(html|htm)$/i.test(file.name) && file.type !== "text/html") {
        showToast("Vui lòng chỉ thả file .html hoặc .htm", true);
        return;
      }

      const reader = new FileReader();
      reader.onload = (e) => {
        currentHtml = String(e.target.result || "");
        const base64 = encodeUtf8Base64(currentHtml);
        const isHosted = window.location.protocol === "http:" || window.location.protocol === "https:";
        const link = isHosted
          ? `${window.location.origin}${window.location.pathname}#site=${base64}`
          : `data:text/html;charset=utf-8;base64,${base64}`;

        fileChip.textContent = file.name;
        sizeTag.textContent = formatSize(file.size);
        urlOutput.value = link;
        btnLaunch.href = link;
        previewFrame.srcdoc = currentHtml;

        btnCopy.textContent = "Copy link";
        btnCopy.classList.remove("copied");
        resultCard.classList.add("show");
        showToast("Đã tạo link thành công!");
      };
      reader.onerror = () => showToast("Không đọc được file này.", true);
      reader.readAsText(file, "utf-8");
    }

    dropZone.addEventListener("click", () => fileInput.click());
    dropZone.addEventListener("keydown", (e) => {
      if (e.key === "Enter" || e.key === " ") {
        e.preventDefault();
        fileInput.click();
      }
    });

    fileInput.addEventListener("change", (e) => {
      if (e.target.files[0]) handleIncomingFile(e.target.files[0]);
      fileInput.value = "";
    });

    ["dragenter", "dragover"].forEach((ev) => {
      dropZone.addEventListener(ev, (e) => {
        e.preventDefault();
        dropZone.classList.add("active");
      });
    });

    ["dragleave", "drop"].forEach((ev) => {
      dropZone.addEventListener(ev, (e) => {
        e.preventDefault();
        dropZone.classList.remove("active");
      });
    });

    dropZone.addEventListener("drop", (e) => {
      const file = e.dataTransfer && e.dataTransfer.files[0];
      if (file) handleIncomingFile(file);
    });

    btnLaunch.addEventListener("click", (e) => {
      if (urlOutput.value.startsWith("data:")) {
        e.preventDefault();
        const win = window.open("", "_blank");
        if (win) {
          win.document.open();
          win.document.write(currentHtml);
          win.document.close();
        } else {
          showToast("Trình duyệt đang chặn tab mới, hãy copy link dán lên thanh địa chỉ.", true);
        }
      }
    });

    btnCopy.addEventListener("click", async () => {
      if (!urlOutput.value) return;
      try {
        await navigator.clipboard.writeText(urlOutput.value);
      } catch {
        urlOutput.select();
        document.execCommand("copy");
      }
      btnCopy.textContent = "Đã copy ✓";
      btnCopy.classList.add("copied");
      showToast("Đã sao chép đường link!");
    });

    btnClear.addEventListener("click", () => {
      currentHtml = "";
      urlOutput.value = "";
      previewFrame.srcdoc = "";
      resultCard.classList.remove("show");
      showToast("");
    });
  </script>
</body>
</html>
