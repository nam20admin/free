<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AetherDrop — Thả File HTML Tạo Link Đẹp Nhất Trái Đất</title>
  <style>
    :root {
      --bg-dark: #050811;
      --surface: rgba(15, 23, 42, 0.72);
      --surface-2: rgba(9, 13, 24, 0.85);
      --border: rgba(255, 255, 255, 0.11);
      --border-glow: rgba(56, 189, 248, 0.55);
      --text: #f8fafc;
      --muted: #94a3b8;
      --cyan: #38bdf8;
      --violet: #a855f7;
      --pink: #ec4899;
      --emerald: #10b981;
      --discord: #5865f2;
      --danger: #fb7185;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Plus Jakarta Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
    }

    body {
      min-height: 100vh;
      color: var(--text);
      background: var(--bg-dark);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      position: relative;
      overflow-x: hidden;
    }

    .aurora {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(95px);
      opacity: 0.42;
      animation: floatOrb 14s ease-in-out infinite alternate;
    }

    .orb-1 {
      width: 420px;
      height: 420px;
      background: radial-gradient(circle, var(--cyan), transparent 70%);
      top: -110px;
      left: -80px;
    }

    .orb-2 {
      width: 460px;
      height: 460px;
      background: radial-gradient(circle, var(--violet), transparent 70%);
      bottom: -140px;
      right: -90px;
      animation-delay: -5s;
    }

    .orb-3 {
      width: 300px;
      height: 300px;
      background: radial-gradient(circle, var(--pink), transparent 70%);
      top: 45%;
      left: 55%;
      opacity: 0.22;
      animation-delay: -9s;
    }

    @keyframes floatOrb {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(35px, -25px) scale(1.12); }
    }

    .container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 1320px;
      background: var(--surface);
      backdrop-filter: blur(22px) saturate(150%);
      -webkit-backdrop-filter: blur(22px) saturate(150%);
      border: 1px solid var(--border);
      border-radius: 26px;
      padding: 28px 24px;
      box-shadow:
        0 30px 80px rgba(0, 0, 0, 0.6),
        inset 0 1px 0 rgba(255, 255, 255, 0.14);
      display: grid;
      gap: 20px;
    }

    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .pill-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 0.74rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #e0f2fe;
      background: linear-gradient(90deg, rgba(56, 189, 248, 0.18), rgba(168, 85, 247, 0.18));
      border: 1px solid rgba(255, 255, 255, 0.16);
    }

    .dot-live {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--emerald);
      box-shadow: 0 0 10px var(--emerald);
    }

    .discord-btn {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 6px 13px;
      border-radius: 999px;
      text-decoration: none;
      font-size: 0.78rem;
      font-weight: 700;
      color: #ffffff;
      background: rgba(88, 101, 242, 0.22);
      border: 1px solid rgba(88, 101, 242, 0.55);
      transition: all 0.2s ease;
    }

    .discord-btn:hover {
      background: var(--discord);
      transform: translateY(-1px);
      box-shadow: 0 8px 20px rgba(88, 101, 242, 0.4);
    }

    .discord-btn svg {
      width: 17px;
      height: 17px;
      fill: currentColor;
      flex-shrink: 0;
    }

    .hero {
      text-align: center;
      display: grid;
      gap: 10px;
    }

    h1 {
      font-size: clamp(1.6rem, 4vw, 2.15rem);
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1.15;
      background: linear-gradient(110deg, #ffffff 15%, #7dd3fc 50%, #d8b4fe 85%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .hero p {
      color: var(--muted);
      font-size: 0.94rem;
      line-height: 1.55;
      max-width: 520px;
      margin: 0 auto;
    }

    .dropzone {
      position: relative;
      border-radius: 20px;
      padding: 44px 22px;
      text-align: center;
      background:
        linear-gradient(var(--surface-2), var(--surface-2)) padding-box,
        repeating-linear-gradient(
          90deg,
          rgba(148, 163, 184, 0.35) 0 10px,
          transparent 10px 18px
        ) border-box;
      border: 1.5px dashed transparent;
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.22, 1, 0.36, 1);
      display: grid;
      gap: 10px;
      justify-items: center;
    }

    .dropzone:hover,
    .dropzone.active {
      transform: translateY(-2px);
      background:
        linear-gradient(rgba(14, 24, 46, 0.92), rgba(14, 24, 46, 0.92)) padding-box,
        linear-gradient(120deg, var(--cyan), var(--violet), var(--pink)) border-box;
      box-shadow: 0 18px 40px rgba(56, 189, 248, 0.16);
    }

    .icon-ring {
      width: 64px;
      height: 64px;
      border-radius: 20px;
      display: grid;
      place-items: center;
      font-size: 1.8rem;
      font-weight: 300;
      color: #fff;
      background: linear-gradient(135deg, rgba(56, 189, 248, 0.25), rgba(168, 85, 247, 0.25));
      border: 1px solid rgba(255, 255, 255, 0.18);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.25);
      transition: transform 0.25s ease;
    }

    .dropzone:hover .icon-ring,
    .dropzone.active .icon-ring {
      transform: scale(1.06) rotate(4deg);
    }

    .drop-main {
      font-size: 1.05rem;
      font-weight: 700;
      color: #f8fafc;
    }

    .drop-sub {
      font-size: 0.85rem;
      color: var(--muted);
    }

    .result-card {
      display: none;
      background: var(--surface-2);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 20px;
      padding: 20px;
      gap: 16px;
      animation: popUp 0.28s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .result-card.show {
      display: grid;
    }

    @keyframes popUp {
      from { opacity: 0; transform: translateY(10px) scale(0.99); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .meta-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }

    .file-chip {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      max-width: 100%;
      padding: 6px 13px;
      border-radius: 999px;
      font-size: 0.82rem;
      font-weight: 700;
      color: #a7f3d0;
      background: rgba(16, 185, 129, 0.14);
      border: 1px solid rgba(16, 185, 129, 0.3);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .size-tag {
      font-size: 0.78rem;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }

    .url-group {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .url-field {
      flex: 1 1 220px;
      min-width: 0;
      background: #050811;
      border: 1px solid rgba(148, 163, 184, 0.22);
      border-radius: 12px;
      padding: 12px 14px;
      color: #7dd3fc;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.8rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .url-field:focus {
      border-color: var(--cyan);
    }

    .btn {
      border: none;
      border-radius: 12px;
      padding: 12px 16px;
      font-size: 0.88rem;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      transition: all 0.18s ease;
    }

    .btn:hover:not(:disabled) {
      transform: translateY(-1px);
      filter: brightness(1.07);
    }

    .btn:active:not(:disabled) {
      transform: translateY(0);
    }

    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .btn-shorten {
      background: rgba(56, 189, 248, 0.16);
      color: #bae6fd;
      border: 1px solid rgba(56, 189, 248, 0.4);
      padding: 10px 14px;
      font-size: 0.84rem;
      white-space: nowrap;
    }

    .btn-shorten.shortened {
      background: rgba(168, 85, 247, 0.2);
      border-color: rgba(168, 85, 247, 0.5);
      color: #e9d5ff;
    }

    .btn-copy {
      background: rgba(255, 255, 255, 0.08);
      color: #f8fafc;
      border: 1px solid rgba(255, 255, 255, 0.16);
      padding: 10px 15px;
      font-size: 0.84rem;
      white-space: nowrap;
    }

    .btn-copy.copied {
      background: rgba(16, 185, 129, 0.2);
      border-color: rgba(16, 185, 129, 0.5);
      color: #6ee7b7;
    }

    .cta-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
    }

    .btn-launch {
      background: linear-gradient(135deg, #38bdf8 0%, #818cf8 55%, #c084fc 100%);
      color: #060913;
      font-weight: 800;
      box-shadow: 0 12px 28px rgba(99, 102, 241, 0.32);
    }

    .btn-ghost {
      background: transparent;
      color: var(--muted);
      border: 1px solid rgba(148, 163, 184, 0.22);
      padding: 10px 15px;
      font-size: 0.84rem;
    }

    .btn-ghost:hover {
      color: #fff;
      border-color: rgba(255, 255, 255, 0.4);
    }

    .preview-box {
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: #0b0f19;
      width: 100%;
    }

    .preview-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 9px 14px;
      background: rgba(255, 255, 255, 0.04);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      font-size: 0.78rem;
      color: var(--muted);
    }

    .preview-head-left {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn-expand {
      background: rgba(255, 255, 255, 0.08);
      color: #e2e8f0;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 8px;
      padding: 4px 10px;
      font-size: 0.74rem;
      font-weight: 700;
      cursor: pointer;
    }

    .btn-expand:hover {
      background: rgba(56, 189, 248, 0.2);
      color: #fff;
    }

    .mac-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }
    .mac-r { background: #fb7185; }
    .mac-y { background: #fbbf24; }
    .mac-g { background: #34d399; }

    .preview-frame {
      width: 100%;
      min-width: 100%;
      height: 76vh;
      min-height: 540px;
      border: none;
      background: #ffffff;
      display: block;
    }

    .toast {
      text-align: center;
      font-size: 0.84rem;
      font-weight: 600;
      color: #7dd3fc;
      min-height: 20px;
    }

    .toast.err {
      color: var(--danger);
    }

    @media (max-width: 640px) {
      .container { padding: 20px 14px; border-radius: 20px; }
      .cta-row { grid-template-columns: 1fr; }
      .preview-frame { height: 68vh; min-height: 420px; }
    }
  </style>
</head>
<body>
  <div class="aurora" aria-hidden="true">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
  </div>

  <main id="studioApp" class="container">
    <div class="top-bar">
      <span class="pill-badge"><span class="dot-live"></span>Instant HTML Link Studio</span>
      <a
        class="discord-btn"
        href="https://discord.com/users/1473671927976562689"
        target="_blank"
        rel="noopener noreferrer"
        title="Mở hồ sơ Discord"
      >

        </svg>
        <span>Discord</span>

    </div>

    <header class="hero">
      <h1>Thả File HTML Tạo Link</h1>
      <p>Kéo thả file <strong>.html</strong> vào khung để tạo đường link mở nhanh và xem trước trực tiếp</p>
    </header>

    <div id="dropZone" class="dropzone" tabindex="0" role="button" aria-label="Kéo thả hoặc chọn file HTML">
      <div class="icon-ring">+</div>
      <div class="drop-main">Kéo & thả file .html vào đây</div>
      <div class="drop-sub">Hoặc bấm để chọn file từ thiết bị của bạn</div>
      <input id="fileInput" type="file" accept=".html,.htm,text/html" hidden />
    </div>

    <section id="resultCard" class="result-card" aria-live="polite">
      <div class="meta-row">
        <span id="fileChip" class="file-chip">page.html</span>

      <div class="url-group">
        <input id="urlOutput" class="url-field" type="text" readonly />

        </div>

    <div id="toast" class="toast"></div>

  <script>
    function decodeSharedHtmlFromHash() {
      const hash = window.location.hash || "";
      if (!hash.startsWith("#site=")) return null;
      const encoded = hash.slice(6).trim();
      if (!encoded) return null;

      try {
        const normalized = encoded.replace(/-/g, "+").replace(/_/g, "/");
        const padded = normalized + "=".repeat((4 - (normalized.length % 4)) % 4);
        const binary = atob(padded);
        const bytes = new Uint8Array(binary.length);
        for (let i = 0; i < binary.length; i++) {
          bytes[i] = binary.charCodeAt(i);
        }
        return new TextDecoder("utf-8", { fatal: false }).decode(bytes);
      } catch (err) {
        console.error("Lỗi giải mã #site=:", err);
        return null;
      }
    }

    function expandSharedPageLayout(doc) {
      if (!doc || !doc.documentElement || !doc.body) return;
      const styleTag = doc.createElement("style");
      styleTag.textContent = `
        html, body {
          width: 100vw !important;
          min-width: 100% !important;
          height: 100vh !important;
          min-height: 100% !important;
          margin: 0 !important;
          padding: 0 !important;
          max-width: none !important;
        }
        body > *:only-child {
          width: 100% !important;
          height: 100% !important;
          min-width: 100% !important;
          min-height: 100% !important;
          max-width: none !important;
        }
      `;
      (doc.head || doc.documentElement).appendChild(styleTag);
    }

    function renderSharedPageIfNeeded() {
      const sharedHtml = decodeSharedHtmlFromHash();
      if (sharedHtml === null) return false;

      document.documentElement.removeAttribute("style");
      document.documentElement.className = "";
      if (document.body) {
        document.body.innerHTML = "";
        document.body.removeAttribute("style");
        document.body.className = "";
      }

      document.open("text/html", "replace");
      document.write(sharedHtml);
      document.close();

      window.addEventListener("DOMContentLoaded", () => expandSharedPageLayout(document), { once: true });
      expandSharedPageLayout(document);
      return true;
    }

    if (!renderSharedPageIfNeeded()) {
      window.addEventListener("hashchange", () => {
        renderSharedPageIfNeeded();
      });

      const dropZone = document.getElementById("dropZone");
      const fileInput = document.getElementById("fileInput");
      const resultCard = document.getElementById("resultCard");
      const fileChip = document.getElementById("fileChip");
      const sizeTag = document.getElementById("sizeTag");
      const urlOutput = document.getElementById("urlOutput");
      const btnShorten = document.getElementById("btnShorten");
      const btnCopy = document.getElementById("btnCopy");
      const btnLaunch = document.getElementById("btnLaunch");
      const btnClear = document.getElementById("btnClear");
      const previewBox = document.getElementById("previewBox");
      const btnExpand = document.getElementById("btnExpand");
      const previewFrame = document.getElementById("previewFrame");
      const toast = document.getElementById("toast");

      let currentHtml = "";
      let currentBlobUrl = "";

      function revokeCurrentBlob() {
        if (currentBlobUrl) {
          URL.revokeObjectURL(currentBlobUrl);
          currentBlobUrl = "";
        }
      }

      function showToast(msg, isError = false) {
        toast.textContent = msg;
        toast.className = isError ? "toast err" : "toast";
      }

      function encodeUtf8Base64(str) {
        const bytes = new TextEncoder().encode(str);
        const chunkSize = 0x8000;
        let binary = "";
        for (let i = 0; i < bytes.length; i += chunkSize) {
          const slice = bytes.subarray(i, i + chunkSize);
          binary += String.fromCharCode.apply(null, slice);
        }
        return btoa(binary);
      }

      function formatSize(bytes) {
        if (bytes < 1024) return `${bytes} B`;
        if (bytes < 1024 * 1024) return `${(bytes / 1024).toFixed(1)} KB`;
        return `${(bytes / (1024 * 1024)).toFixed(2)} MB`;
      }

      function resetActionStates() {
        btnCopy.textContent = "Copy link";
        btnCopy.classList.remove("copied");
        btnShorten.textContent = "Rút gọn link";
        btnShorten.classList.remove("shortened");
        btnShorten.disabled = false;
      }

      async function shortenUrl(longUrl) {
        if (longUrl.startsWith("blob:")) {
          throw new Error("Link blob chỉ dùng nội bộ trên trình duyệt hiện tại, hãy mở qua http/https để rút gọn.");
        }

        const shortFromIsGd = await new Promise((resolve) => {
          const cbName = "__isgd_cb_" + Date.now() + "_" + Math.floor(Math.random() * 10000);
          const script = document.createElement("script");
          const timer = setTimeout(() => {
            cleanup();
            resolve(null);
          }, 6500);

          function cleanup() {
            clearTimeout(timer);
            delete window[cbName];
            if (script.parentNode) script.parentNode.removeChild(script);
          }

          window[cbName] = (data) => {
            cleanup();
            if (data && data.shorturl) {
              resolve(data.shorturl);
            } else {
              resolve(null);
            }
          };

          script.src = `https://is.gd/create.php?format=json&callback=${cbName}&url=${encodeURIComponent(longUrl)}`;
          script.onerror = () => {
            cleanup();
            resolve(null);
          };
          document.body.appendChild(script);
        });

        if (shortFromIsGd) return shortFromIsGd;

        const tinyRes = await fetch(`https://tinyurl.com/api-create.php?url=${encodeURIComponent(longUrl)}`);
        if (tinyRes.ok) {
          const tinyText = (await tinyRes.text()).trim();
          if (tinyText.startsWith("http")) return tinyText;
        }

        throw new Error("Không thể rút gọn link lúc này (có thể do link quá dài hoặc bị chặn mạng).");
      }

      function handleIncomingFile(file) {
        if (!file) return;
        if (!/\.(html|htm)$/i.test(file.name) && file.type !== "text/html") {
          showToast("Vui lòng chỉ thả file .html hoặc .htm", true);
          return;
        }

        const reader = new FileReader();
        reader.onload = (e) => {
          currentHtml = String(e.target.result || "");
          revokeCurrentBlob();

          const blob = new Blob([currentHtml], { type: "text/html;charset=utf-8" });
          currentBlobUrl = URL.createObjectURL(blob);

          const isHosted = window.location.protocol === "http:" || window.location.protocol === "https:";
          let shareLink = currentBlobUrl;

          if (isHosted) {
            const base64 = encodeUtf8Base64(currentHtml);
            shareLink = `${window.location.origin}${window.location.pathname}#site=${base64}`;
          }

          fileChip.textContent = file.name;
          sizeTag.textContent = formatSize(file.size);
          urlOutput.value = shareLink;
          btnLaunch.href = shareLink;
          previewFrame.srcdoc = currentHtml;

          resetActionStates();
          resultCard.classList.add("show");

          if (isHosted && shareLink.length > 65000) {
            showToast("Đã tạo link (file hơi dài, một số trình duyệt có thể hạn chế link quá dài).", false);
          } else {
            showToast("Đã tạo link thành công! Bạn có thể bấm Rút gọn link.");
          }
        };
        reader.onerror = () => showToast("Không đọc được file này.", true);
        reader.readAsText(file, "utf-8");
      }

      btnExpand.addEventListener("click", async () => {
        try {
          if (previewBox.requestFullscreen) {
            await previewBox.requestFullscreen();
          } else if (previewFrame.requestFullscreen) {
            await previewFrame.requestFullscreen();
          }
        } catch {
          showToast("Trình duyệt không hỗ trợ toàn màn hình trực tiếp, bạn có thể bấm Mở link ngay.", true);
        }
      });

      btnShorten.addEventListener("click", async () => {
        const rawUrl = urlOutput.value.trim();
        if (!rawUrl) return;

        btnShorten.disabled = true;
        btnShorten.textContent = "Đang rút gọn...";
        showToast("Đang tạo link rút gọn...");

        try {
          const shortUrl = await shortenUrl(rawUrl);
          urlOutput.value = shortUrl;
          btnShorten.textContent = "Đã rút gọn ✓";
          btnShorten.classList.add("shortened");
          btnCopy.textContent = "Copy link";
          btnCopy.classList.remove("copied");
          showToast("Đã rút gọn link thành công!");
        } catch (err) {
          btnShorten.disabled = false;
          btnShorten.textContent = "Rút gọn link";
          showToast(err && err.message ? err.message : "Rút gọn link thất bại.", true);
        }
      });

      dropZone.addEventListener("click", () => fileInput.click());
      dropZone.addEventListener("keydown", (e) => {
        if (e.key === "Enter" || e.key === " ") {
          e.preventDefault();
          fileInput.click();
        }
      });

      fileInput.addEventListener("change", (e) => {
        if (e.target.files[0]) handleIncomingFile(e.target.files[0]);
        fileInput.value = "";
      });

      ["dragenter", "dragover"].forEach((ev) => {
        dropZone.addEventListener(ev, (e) => {
          e.preventDefault();
          dropZone.classList.add("active");
        });
      });

      ["dragleave", "drop"].forEach((ev) => {
        dropZone.addEventListener(ev, (e) => {
          e.preventDefault();
          dropZone.classList.remove("active");
        });
      });

      dropZone.addEventListener("drop", (e) => {
        const file = e.dataTransfer && e.dataTransfer.files[0];
        if (file) handleIncomingFile(file);
      });

      btnCopy.addEventListener("click", async () => {
        if (!urlOutput.value) return;
        try {
          await navigator.clipboard.writeText(urlOutput.value);
        } catch {
          urlOutput.select();
          document.execCommand("copy");
        }
        btnCopy.textContent = "Đã copy ✓";
        btnCopy.classList.add("copied");
        showToast("Đã sao chép đường link!");
      });

      btnClear.addEventListener("click", () => {
        currentHtml = "";
        revokeCurrentBlob();
        urlOutput.value = "";
        btnLaunch.href = "#";
        previewFrame.srcdoc = "";
        resetActionStates();
        resultCard.classList.remove("show");
        showToast("");
      });
    }
  </script>
</body>
</html>
